<style>
:root { --ink:#000; --paper:#fff; --red:#dd0000; --gold:#ffce00; --grey:#767676; --line:#e5e5e5; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif; background:var(--paper); color:var(--ink); }
.band { position:fixed; top:0; left:0; right:0; height:6px; z-index:10;
  background:linear-gradient(to right, #000 0 33.4%, var(--red) 33.4% 66.7%, var(--gold) 66.7% 100%); }
.wrap { max-width:560px; margin:0 auto; padding:calc(26px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom)); min-height:100%; display:flex; flex-direction:column; }
h1 { font-size:26px; font-weight:700; letter-spacing:-0.01em; margin-bottom:2px; }
.sub { color:var(--grey); font-size:14px; margin-bottom:20px; }
.row { display:flex; justify-content:space-between; align-items:baseline; padding:14px 0; border-bottom:1px solid var(--line); font-size:16px; }
.row b { font-size:17px; }
.btn { display:block; width:100%; border:none; background:var(--ink); color:#fff; font:inherit; font-size:17px; font-weight:600; padding:16px; border-radius:14px; margin-top:14px; cursor:pointer; }
.btn:disabled { background:#e2e2e2; color:#9a9a9a; }
.btn2 { display:block; width:100%; background:#fff; color:var(--ink); border:1.5px solid var(--ink); font:inherit; font-size:17px; font-weight:600; padding:15px; border-radius:14px; margin-top:12px; cursor:pointer; }
.btn2:disabled { border-color:#ccc; color:#aaa; }
.link { background:none; border:none; font:inherit; font-size:14px; color:var(--grey); text-decoration:underline; padding:0; margin-top:18px; cursor:pointer; display:inline-block; }
.warn { color:#c00; font-size:14px; margin-top:14px; line-height:1.45; }
.goalbtns { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.goalbtns .btn { margin-top:0; }
.progress { font-size:13px; color:var(--grey); margin-bottom:12px; letter-spacing:0.04em; text-transform:uppercase; }
.badge { display:inline-block; font-size:11px; font-weight:600; letter-spacing:0.06em; border:1px solid var(--ink); padding:2px 7px; border-radius:99px; margin-bottom:10px; }
.card { perspective:1200px; flex:1; min-height:320px; margin-top:6px; cursor:pointer; }
.card-inner { position:relative; width:100%; height:100%; min-height:320px; transition:transform .5s; transform-style:preserve-3d; }
.card.flipped .card-inner { transform:rotateY(180deg); }
@media (prefers-reduced-motion: reduce){ .card-inner{ transition:none; } }
.face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:1.5px solid var(--ink); border-radius:18px; padding:22px; display:flex; flex-direction:column; justify-content:center; }
.face.back { transform:rotateY(180deg); background:#fafafa; }
.q-de { font-size:19px; font-weight:600; line-height:1.4; margin-bottom:10px; }
.q-en { font-size:14px; color:var(--grey); line-height:1.45; }
.hint { text-align:center; font-size:12px; color:var(--grey); margin-top:12px; }
.a-de { font-size:20px; font-weight:700; line-height:1.4; margin-bottom:8px; }
.opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid #d8d8d8; font:inherit; font-size:16px; line-height:1.4; padding:13px 14px; border-radius:12px; margin-top:10px; cursor:pointer; }
.opt.correct { border-color:#0a7d33; background:#eef8f1; font-weight:600; }
.opt.wrong { border-color:#c00; background:#fdeeee; }
.opt:disabled { opacity:1; }
textarea { width:100%; height:64px; font-family:ui-monospace,monospace; font-size:11px; border:1px solid #ccc; border-radius:8px; padding:6px; margin-top:4px; }
.backup { border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
.score { font-size:44px; font-weight:700; margin:16px 0 4px; }
.spacer { flex:1; }
</style>
</head>

<script>
const QUESTIONS = [
  { id: 1, q_de: "In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil …", q_en: "In Germany, people may openly speak out against the government because …", options: ["hier Religionsfreiheit gilt.", "die Menschen Steuern zahlen.", "die Menschen das Wahlrecht haben.", "hier Meinungsfreiheit gilt."], correct: 3, a_en: "freedom of expression applies here" },
  { id: 2, q_de: "In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am … teilnimmt.", q_en: "In Germany, parents can decide until their child turns 14 whether it takes part in … at school.", options: ["Geschichtsunterricht", "Religionsunterricht", "Politikunterricht", "Sprachunterricht"], correct: 1, a_en: "religious education" },
  { id: 3, q_de: "Deutschland ist ein Rechtsstaat. Was ist damit gemeint?", q_en: "Germany is a state under the rule of law. What does that mean?", options: ["Alle Einwohner / Einwohnerinnen und der Staat müssen sich an die Gesetze halten.", "Der Staat muss sich nicht an die Gesetze halten.", "Nur Deutsche müssen die Gesetze befolgen.", "Die Gerichte machen die Gesetze."], correct: 0, a_en: "All residents and the state must obey the law." },
  { id: 4, q_de: "Welches Recht gehört zu den Grundrechten in Deutschland?", q_en: "Which right is one of the basic rights in Germany?", options: ["Waffenbesitz", "Faustrecht", "Meinungsfreiheit", "Selbstjustiz"], correct: 2, a_en: "Freedom of expression" },
  { id: 5, q_de: "Wen müssen Sie in Deutschland auf Verlangen in Ihre Wohnung lassen?", q_en: "Whom must you let into your home in Germany on request?", options: ["den Postboten / die Postbotin", "den Vermieter / die Vermieterin", "den Nachbarn / die Nachbarin", "den Arbeitgeber / die Arbeitgeberin"], correct: 1, a_en: "The landlord / landlady" },
  { id: 6, q_de: "Wie heißt die deutsche Verfassung?", q_en: "What is the German constitution called?", options: ["Volksgesetz", "Bundesgesetz", "Deutsches Gesetz", "Grundgesetz"], correct: 3, a_en: "The Basic Law (Grundgesetz)" },
  { id: 7, q_de: "Welches Recht gehört zu den Grundrechten, die nach der deutschen Verfassung garantiert werden? Das Recht auf …", q_en: "Which right is guaranteed as a basic right by the German constitution? The right to …", options: ["Glaubens- und Gewissensfreiheit", "Unterhaltung", "Arbeit", "Wohnung"], correct: 0, a_en: "freedom of belief and conscience" },
  { id: 8, q_de: "Was steht nicht im Grundgesetz von Deutschland?", q_en: "Which of these is NOT in the German Basic Law?", options: ["Die Würde des Menschen ist unantastbar.", "Alle sollen gleich viel Geld haben.", "Jeder Mensch darf seine Meinung sagen.", "Alle sind vor dem Gesetz gleich."], correct: 1, a_en: "'Everyone should have the same amount of money.'" },
  { id: 9, q_de: "Welches Grundrecht gilt in Deutschland nur für Ausländer / Ausländerinnen? Das Grundrecht auf …", q_en: "Which basic right applies only to foreigners in Germany? The basic right to …", options: ["Schutz der Familie", "Menschenwürde", "Asyl", "Meinungsfreiheit"], correct: 2, a_en: "asylum" },
  { id: 10, q_de: "Was ist mit dem deutschen Grundgesetz vereinbar?", q_en: "What is compatible with the German Basic Law?", options: ["die Prügelstrafe", "die Folter", "die Todesstrafe", "die Geldstrafe"], correct: 3, a_en: "Fines (monetary penalties)" },
  { id: 11, q_de: "Wie wird die Verfassung der Bundesrepublik Deutschland genannt?", q_en: "What is the constitution of the Federal Republic of Germany called?", options: ["Grundgesetz", "Bundesverfassung", "Gesetzbuch", "Verfassungsvertrag"], correct: 0, a_en: "The Basic Law (Grundgesetz)" },
  { id: 12, q_de: "Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?", q_en: "A party in the Bundestag wants to abolish freedom of the press. Is that possible?", options: ["Ja, wenn mehr als die Hälfte der Abgeordneten dafür sind.", "Ja, aber dazu müssen zwei Drittel der Abgeordneten dafür sein.", "Nein, denn die Pressefreiheit ist ein Grundrecht. Sie kann nicht abgeschafft werden.", "Nein, denn nur der Bundesrat kann die Pressefreiheit abschaffen."], correct: 2, a_en: "No — freedom of the press is a basic right and cannot be abolished." },
  { id: 13, q_de: "Wer in seiner Heimat wegen seiner politischen Meinung verfolgt wird und deshalb nach Deutschland flieht, kann was beantragen?", q_en: "Someone persecuted at home for their political views who flees to Germany can apply for what?", options: ["Begrüßungsgeld", "Asyl", "Arbeitslosengeld", "Rente"], correct: 1, a_en: "Asylum" },
  { id: 14, q_de: "Meinungsfreiheit in Deutschland heißt, dass ich …", q_en: "Freedom of expression in Germany means that I …", options: ["auf Flugblättern falsche Tatsachen behaupten darf.", "meine Meinung in Leserbriefen äußern kann.", "Nazi-Symbole tragen darf.", "meine Meinung sagen darf, solange ich der Regierung nicht widerspreche."], correct: 1, a_en: "can express my opinion in letters to the editor." },
  { id: 15, q_de: "Was verbietet das deutsche Grundgesetz?", q_en: "What does the German Basic Law forbid?", options: ["Militärdienst", "Zwangsarbeit", "freie Berufswahl", "Arbeit im Ausland"], correct: 1, a_en: "Forced labour" },
  { id: 16, q_de: "Wann ist die Meinungsfreiheit in Deutschland eingeschränkt?", q_en: "When is freedom of expression restricted in Germany?", options: ["bei der öffentlichen Verbreitung falscher Behauptungen über einzelne Personen", "bei Meinungsäußerungen über die Bundesregierung", "bei Diskussionen über Religionen", "bei Kritik am Staat"], correct: 0, a_en: "When false claims about individuals are spread publicly" },
  { id: 17, q_de: "Die deutschen Gesetze verbieten …", q_en: "German laws forbid …", options: ["Meinungsfreiheit der Einwohner und Einwohnerinnen.", "Petitionen der Bürger und Bürgerinnen.", "Versammlungsfreiheit der Einwohner und Einwohnerinnen.", "Ungleichbehandlung der Bürger und Bürgerinnen durch den Staat."], correct: 3, a_en: "unequal treatment of citizens by the state." },
  { id: 18, q_de: "Welches Grundrecht ist in Artikel 1 des Grundgesetzes der Bundesrepublik Deutschland garantiert?", q_en: "Which basic right is guaranteed in Article 1 of the Basic Law?", options: ["die Unantastbarkeit der Menschenwürde", "das Recht auf Leben", "Religionsfreiheit", "Meinungsfreiheit"], correct: 0, a_en: "The inviolability of human dignity" },
  { id: 19, q_de: "Was versteht man unter dem Recht der „Freizügigkeit“ in Deutschland?", q_en: "What does the right of 'free movement' mean in Germany?", options: ["Man darf sich seinen Wohnort selbst aussuchen.", "Man kann seinen Beruf wechseln.", "Man darf sich für eine andere Religion entscheiden.", "Man darf sich in der Öffentlichkeit nur leicht bekleidet bewegen."], correct: 0, a_en: "You may choose your own place of residence." },
  { id: 20, q_de: "Eine Partei in Deutschland verfolgt das Ziel, eine Diktatur zu errichten. Sie ist dann …", q_en: "A party in Germany aims to establish a dictatorship. It is then …", options: ["tolerant.", "rechtsstaatlich orientiert.", "gesetzestreu.", "verfassungswidrig."], correct: 3, a_en: "unconstitutional." },
  { id: 21, q_de: "Was zeigt das Wappen der Bundesrepublik Deutschland? (Bildfrage, angepasst)", q_en: "What does the coat of arms of the Federal Republic show? (image question, adapted)", options: ["einen schwarzen Adler", "einen Bären", "einen Löwen", "ein Pferd"], correct: 0, a_en: "A black eagle" },
  { id: 22, q_de: "Was für eine Staatsform hat Deutschland?", q_en: "What form of state does Germany have?", options: ["Monarchie", "Diktatur", "Republik", "Fürstentum"], correct: 2, a_en: "A republic" },
  { id: 23, q_de: "Wenn man in Deutschland ein bestimmtes Alter erreicht und aufhört zu arbeiten, was bekommt man dann meistens?", q_en: "When you reach a certain age in Germany and stop working, what do you usually receive?", options: ["Rente", "Gehalt", "nichts", "Ausbildungsgeld"], correct: 0, a_en: "A pension (Rente)" },
  { id: 24, q_de: "Wie viele Bundesländer hat die Bundesrepublik Deutschland?", q_en: "How many federal states does Germany have?", options: ["14", "15", "16", "17"], correct: 2, a_en: "16" },
  { id: 25, q_de: "Die Bundesrepublik Deutschland besteht aus …", q_en: "The Federal Republic of Germany consists of …", options: ["12 Bezirken.", "16 Bundesländern.", "einem Oststaat und einem Weststaat.", "16 Freistaaten."], correct: 1, a_en: "16 federal states." },
  { id: 26, q_de: "Deutschland ist …", q_en: "Germany is …", options: ["eine kommunistische Republik.", "ein demokratischer und sozialer Bundesstaat.", "eine kapitalistische und soziale Monarchie.", "ein sozialer und sozialistischer Bundesstaat."], correct: 1, a_en: "a democratic and social federal state." },
  { id: 27, q_de: "Deutschland ist …", q_en: "Germany is …", options: ["ein sozialistischer Staat.", "ein Bundesstaat.", "eine Diktatur.", "eine Monarchie."], correct: 1, a_en: "a federal state." },
  { id: 28, q_de: "Wer wählt in Deutschland die Abgeordneten zum Bundestag?", q_en: "Who elects the members of the Bundestag in Germany?", options: ["das Militär", "die Wirtschaft", "das wahlberechtigte Volk", "die Verwaltung"], correct: 2, a_en: "The people entitled to vote" },
  { id: 29, q_de: "Welches Tier ist das Wappentier der Bundesrepublik Deutschland?", q_en: "Which animal is the heraldic animal of Germany?", options: ["Löwe", "Adler", "Bär", "Pferd"], correct: 1, a_en: "The eagle" },
  { id: 30, q_de: "Was ist kein Merkmal unserer Demokratie?", q_en: "What is NOT a feature of our democracy?", options: ["regelmäßige Wahlen", "Pressezensur", "Meinungsfreiheit", "verschiedene Parteien"], correct: 1, a_en: "Press censorship" },
  { id: 31, q_de: "Die Zusammenarbeit von Parteien zur Bildung einer Regierung nennt man in Deutschland …", q_en: "The cooperation of parties to form a government is called …", options: ["Einheit.", "Koalition.", "Ministerium.", "Fraktion."], correct: 1, a_en: "a coalition." },
  { id: 32, q_de: "Was ist keine staatliche Gewalt in Deutschland?", q_en: "What is NOT a branch of state power in Germany?", options: ["Gesetzgebung", "Regierung", "Presse", "Rechtsprechung"], correct: 2, a_en: "The press" },
  { id: 33, q_de: "Welche Aussage ist richtig? In Deutschland …", q_en: "Which statement is correct? In Germany …", options: ["sind Staat und Religionsgemeinschaften voneinander getrennt.", "bilden die Religionsgemeinschaften den Staat.", "ist der Staat abhängig von den Religionsgemeinschaften.", "bilden Staat und Religionsgemeinschaften eine Einheit."], correct: 0, a_en: "state and religious communities are separate." },
  { id: 34, q_de: "Was ist Deutschland nicht?", q_en: "What is Germany NOT?", options: ["eine Demokratie", "ein Rechtsstaat", "eine Monarchie", "ein Sozialstaat"], correct: 2, a_en: "A monarchy" },
  { id: 35, q_de: "Womit finanziert der deutsche Staat die Sozialversicherung?", q_en: "How does the German state finance social insurance?", options: ["Kirchensteuern", "Sozialabgaben", "Spendengeldern", "Vereinsbeiträgen"], correct: 1, a_en: "With social security contributions (Sozialabgaben)" },
  { id: 36, q_de: "Welche Maßnahme schafft in Deutschland soziale Sicherheit?", q_en: "Which measure creates social security in Germany?", options: ["die Krankenversicherung", "die Autoversicherung", "die Gebäudeversicherung", "die Haftpflichtversicherung"], correct: 0, a_en: "Health insurance" },
  { id: 37, q_de: "Wie werden die Regierungschefs / Regierungschefinnen der meisten Bundesländer in Deutschland genannt?", q_en: "What are the heads of government of most German federal states called?", options: ["Erster Minister / Erste Ministerin", "Premierminister / Premierministerin", "Senator / Senatorin", "Ministerpräsident / Ministerpräsidentin"], correct: 3, a_en: "Minister President (Ministerpräsident/in)" },
  { id: 38, q_de: "Die Bundesrepublik Deutschland ist ein demokratischer und sozialer …", q_en: "The Federal Republic of Germany is a democratic and social …", options: ["Staatenverbund.", "Bundesstaat.", "Staatenbund.", "Zentralstaat."], correct: 1, a_en: "federal state." },
  { id: 39, q_de: "Was hat jedes deutsche Bundesland?", q_en: "What does every German federal state have?", options: ["einen eigenen Außenminister / eine eigene Außenministerin", "eine eigene Währung", "eine eigene Armee", "eine eigene Regierung"], correct: 3, a_en: "Its own government" },
  { id: 40, q_de: "Mit welchen Worten beginnt die deutsche Nationalhymne?", q_en: "With which words does the German national anthem begin?", options: ["Völker, hört die Signale …", "Einigkeit und Recht und Freiheit …", "Freude schöner Götterfunken …", "Deutschland einig Vaterland …"], correct: 1, a_en: "'Einigkeit und Recht und Freiheit …' (Unity and justice and freedom)" },
  { id: 41, q_de: "Warum gibt es in einer Demokratie mehr als eine Partei?", q_en: "Why is there more than one party in a democracy?", options: ["weil dadurch die unterschiedlichen Meinungen der Bürger und Bürgerinnen vertreten werden", "damit Bestechung in der Politik begrenzt wird", "um politische Demonstrationen zu verhindern", "um wirtschaftlichen Wettbewerb anzuregen"], correct: 0, a_en: "So the different opinions of citizens are represented" },
  { id: 42, q_de: "Wer beschließt in Deutschland ein neues Gesetz?", q_en: "Who passes a new law in Germany?", options: ["die Regierung", "das Parlament", "die Gerichte", "die Polizei"], correct: 1, a_en: "The parliament" },
  { id: 43, q_de: "Wann kann in Deutschland eine Partei verboten werden?", q_en: "When can a party be banned in Germany?", options: ["wenn ihr Wahlkampf zu teuer ist", "wenn sie gegen die Verfassung kämpft", "wenn sie Kritik am Staatsoberhaupt äußert", "wenn ihr Programm eine neue Richtung vorschlägt"], correct: 1, a_en: "When it fights against the constitution" },
  { id: 44, q_de: "Wen kann man als Bürger / Bürgerin in Deutschland nicht direkt wählen?", q_en: "Whom can citizens in Germany NOT elect directly?", options: ["Abgeordnete des EU-Parlaments", "den Bundespräsidenten / die Bundespräsidentin", "Landtagsabgeordnete", "Bundestagsabgeordnete"], correct: 1, a_en: "The Federal President" },
  { id: 45, q_de: "Zu welcher Versicherung gehört die Pflegeversicherung?", q_en: "The long-term care insurance belongs to which insurance?", options: ["Sozialversicherung", "Unfallversicherung", "Hausratversicherung", "Haftpflicht- und Feuerversicherung"], correct: 0, a_en: "Social insurance" },
  { id: 46, q_de: "Der deutsche Staat hat viele Aufgaben. Welche Aufgabe gehört dazu?", q_en: "The German state has many tasks. Which one belongs to them?", options: ["Er baut Straßen und Schulen.", "Er verkauft Lebensmittel und Kleidung.", "Er versorgt alle Einwohner und Einwohnerinnen kostenlos mit Zeitungen.", "Er produziert Autos und Busse."], correct: 0, a_en: "It builds roads and schools." },
  { id: 47, q_de: "Der deutsche Staat hat viele Aufgaben. Welche Aufgabe gehört nicht dazu?", q_en: "Which task does NOT belong to the German state?", options: ["Er bezahlt für alle Staatsangehörigen Urlaubsreisen.", "Er zahlt Kindergeld.", "Er unterstützt Museen.", "Er fördert Sportler und Sportlerinnen."], correct: 0, a_en: "Paying for holidays for all citizens" },
  { id: 48, q_de: "Welches Organ gehört nicht zu den Verfassungsorganen Deutschlands?", q_en: "Which body is NOT a constitutional organ of Germany?", options: ["der Bundesrat", "der Bundespräsident / die Bundespräsidentin", "die Bürgerversammlung", "die Regierung"], correct: 2, a_en: "The citizens' assembly (Bürgerversammlung)" },
  { id: 49, q_de: "Wer bestimmt in Deutschland die Schulpolitik?", q_en: "Who determines school policy in Germany?", options: ["die Lehrer und Lehrerinnen", "die Bundesländer", "das Familienministerium", "die Universitäten"], correct: 1, a_en: "The federal states" },
  { id: 50, q_de: "Die Wirtschaftsform in Deutschland nennt man …", q_en: "The economic system in Germany is called …", options: ["freie Zentralwirtschaft.", "soziale Marktwirtschaft.", "gelenkte Zentralwirtschaft.", "Planwirtschaft."], correct: 1, a_en: "social market economy." },
  { id: 51, q_de: "Zu einem demokratischen Rechtsstaat gehört es nicht, dass …", q_en: "It is NOT part of a democratic state under the rule of law that …", options: ["Menschen sich kritisch über die Regierung äußern können.", "Bürger friedlich demonstrieren gehen dürfen.", "Menschen von einer Privatpolizei ohne Grund verhaftet werden.", "jemand ein Verbrechen begeht und deshalb verhaftet wird."], correct: 2, a_en: "people are arrested without reason by a private police force." },
  { id: 52, q_de: "Was bedeutet „Volkssouveränität“? Alle Staatsgewalt geht vom …", q_en: "What does 'popular sovereignty' mean? All state power comes from the …", options: ["Volke aus.", "Bundestag aus.", "preußischen König aus.", "Bundesverfassungsgericht aus."], correct: 0, a_en: "people." },
  { id: 53, q_de: "Was bedeutet „Rechtsstaat“ in Deutschland?", q_en: "What does 'rule of law' mean in Germany?", options: ["Der Staat hat Recht.", "Es gibt nur rechte Parteien.", "Die Bürger und Bürgerinnen entscheiden über Gesetze.", "Der Staat muss die Gesetze einhalten."], correct: 3, a_en: "The state must obey the laws." },
  { id: 54, q_de: "Was ist keine staatliche Gewalt in Deutschland?", q_en: "What is NOT a branch of state power in Germany?", options: ["Legislative", "Judikative", "Exekutive", "Direktive"], correct: 3, a_en: "'Direktive' (not a real branch)" },
  { id: 55, q_de: "In welchem Gebäude in Berlin tagt der Deutsche Bundestag? (Bildfrage, angepasst)", q_en: "In which building in Berlin does the Bundestag meet? (image question, adapted)", options: ["im Reichstagsgebäude", "im Bundeskanzleramt", "im Schloss Bellevue", "im Roten Rathaus"], correct: 0, a_en: "In the Reichstag building" },
  { id: 56, q_de: "Welches Amt gehört in Deutschland zur Gemeindeverwaltung?", q_en: "Which office is part of the municipal administration in Germany?", options: ["Pfarramt", "Ordnungsamt", "Finanzamt", "Auswärtiges Amt"], correct: 1, a_en: "The public order office (Ordnungsamt)" },
  { id: 57, q_de: "Es gehört nicht zu den Aufgaben des deutschen Bundesrates, …", q_en: "It is NOT a task of the German Bundesrat …", options: ["an der Verwaltung des Bundes mitzuwirken.", "die Interessen der Länder zu wahren.", "den Bundeskanzler / die Bundeskanzlerin zu wählen.", "an der Gesetzgebung des Bundes mitzuwirken."], correct: 2, a_en: "to elect the Federal Chancellor." },
  { id: 58, q_de: "Wer ernennt in Deutschland die Minister / die Ministerinnen der Bundesregierung?", q_en: "Who appoints the ministers of the federal government?", options: ["der Präsident / die Präsidentin des Bundesverfassungsgerichtes", "der Bundespräsident / die Bundespräsidentin", "der Bundesratspräsident / die Bundesratspräsidentin", "der Bundestagspräsident / die Bundestagspräsidentin"], correct: 1, a_en: "The Federal President" },

  { id: 74, q_de: "Wie heißt das Parlament für ganz Deutschland?", q_en: "What is the parliament for all of Germany called?", options: ["Bundesversammlung", "Volkskammer", "Bundestag", "Bundesgerichtshof"], correct: 2, a_en: "The Bundestag" },

  { id: 87, q_de: "Wer ist das Staatsoberhaupt der Bundesrepublik Deutschland?", q_en: "Who is the head of state of Germany?", options: ["der Bundeskanzler / die Bundeskanzlerin", "der Bundespräsident / die Bundespräsidentin", "der Bundesratspräsident / die Bundesratspräsidentin", "der Bundestagspräsident / die Bundestagspräsidentin"], correct: 1, a_en: "The Federal President" },

  { id: 93, q_de: "Ab welchem Alter darf man in Deutschland bei der Bundestagswahl wählen?", q_en: "From what age may you vote in Bundestag elections?", options: ["ab 18 Jahren", "ab 19 Jahren", "ab 20 Jahren", "ab 21 Jahren"], correct: 0, a_en: "From 18" },

  { id: 95, q_de: "Was gilt für die meisten Kinder in Deutschland?", q_en: "What applies to most children in Germany?", options: ["Wahlpflicht", "Schulpflicht", "Schweigepflicht", "Religionspflicht"], correct: 1, a_en: "Compulsory schooling" },
  { id: 96, q_de: "Was muss jeder deutsche Staatsbürger / jede deutsche Staatsbürgerin ab dem 16. Lebensjahr besitzen?", q_en: "What must every German citizen own from the age of 16?", options: ["einen Reisepass", "einen Personalausweis", "einen Sozialversicherungsausweis", "einen Führerschein"], correct: 1, a_en: "An identity card (Personalausweis)" },
  { id: 97, q_de: "Was bezahlt man in Deutschland automatisch, wenn man fest angestellt ist?", q_en: "What do you automatically pay in Germany if you are permanently employed?", options: ["Sozialversicherung", "Sozialhilfe", "Kindergeld", "Wohngeld"], correct: 0, a_en: "Social insurance contributions" },
  { id: 98, q_de: "Welche Pflicht gilt in Deutschland nur für männliche und nicht für weibliche Staatsangehörige?", q_en: "Which duty applies in Germany only to male citizens, not female?", options: ["Wehrpflicht", "Schulpflicht", "Wahlpflicht", "Steuerpflicht"], correct: 0, a_en: "Military service duty (Wehrpflicht; suspended since 2011)" },
  { id: 99, q_de: "Wer bezahlt in Deutschland die Sozialversicherungen?", q_en: "Who pays for social insurance in Germany?", options: ["Arbeitgeber / Arbeitgeberinnen und Arbeitnehmer / Arbeitnehmerinnen", "nur Arbeitnehmer / Arbeitnehmerinnen", "alle Staatsangehörigen", "nur Arbeitgeber / Arbeitgeberinnen"], correct: 0, a_en: "Employers and employees" },
  { id: 100, q_de: "Jeder / Jede deutsche Staatsangehörige muss …", q_en: "Every German citizen must …", options: ["immer einen Reisepass dabei haben.", "mit Vollendung des 16. Lebensjahres einen gültigen Personalausweis oder einen gültigen Reisepass besitzen.", "immer eine Krankenkassenkarte dabei haben.", "mit Vollendung des 18. Lebensjahres einen Führerschein besitzen."], correct: 1, a_en: "own a valid ID card or passport from age 16." },

  { id: 102, q_de: "Alexander muss zur Bundeswehr. Er möchte aber aus Gewissensgründen nicht lernen, wie man auf andere Menschen schießt. Was kann er tun?", q_en: "Alexander must join the army but refuses on grounds of conscience to learn to shoot at people. What can he do?", options: ["Nichts, er muss zur Armee.", "Er kann Zivildienst leisten.", "Er kann sich freikaufen. Dafür muss er 1 000 € zahlen.", "Er kann eine Fortbildung machen."], correct: 1, a_en: "He can do civilian service instead." },
  { id: 103, q_de: "Wer ist in Deutschland wehrpflichtig?", q_en: "Who is subject to military service duty in Germany?", options: ["alle Frauen und Männer, die 18 Jahre alt sind", "alle männlichen Staatsbürger, die 18 Jahre alt sind", "alle Frauen und Männer, die 21 Jahre alt sind", "alle Männer, die 16 Jahre alt sind"], correct: 1, a_en: "All male citizens aged 18 (duty suspended since 2011)" },
  { id: 104, q_de: "Eine Frau in Deutschland verliert ihre Arbeit. Was darf nicht der Grund für diese Entlassung sein?", q_en: "A woman in Germany loses her job. What must NOT be the reason for the dismissal?", options: ["Die Frau ist lange krank und arbeitsunfähig.", "Die Frau kam oft zu spät zur Arbeit.", "Die Frau erledigt private Sachen während der Arbeitszeit.", "Die Frau bekommt ein Kind und ihr Chef weiß das."], correct: 3, a_en: "That she is expecting a child and her boss knows it" },
  { id: 105, q_de: "Was ist eine Aufgabe von Wahlhelfern / Wahlhelferinnen in Deutschland?", q_en: "What is one task of election workers in Germany?", options: ["Sie helfen alten Menschen bei der Stimmabgabe in der Wahlkabine.", "Sie schreiben die Wahlbenachrichtigungen vor der Wahl.", "Sie geben Zwischenergebnisse an die Medien weiter.", "Sie zählen die Stimmen nach dem Ende der Wahl."], correct: 3, a_en: "They count the votes after the election ends." },
  { id: 106, q_de: "In Deutschland helfen ehrenamtliche Wahlhelfer und Wahlhelferinnen bei den Wahlen. Was ist eine Aufgabe von Wahlhelfern / Wahlhelferinnen?", q_en: "Volunteer election workers help at elections. What is one of their tasks?", options: ["Sie helfen Kindern und alten Menschen beim Wählen.", "Sie schreiben Karten und Briefe mit der Angabe des Wahllokals.", "Sie geben Zwischenergebnisse an Journalisten weiter.", "Sie zählen die Stimmen nach dem Ende der Wahl."], correct: 3, a_en: "They count the votes after the election ends." },
  { id: 107, q_de: "Für wie viele Jahre wird der Bundestag in Deutschland gewählt?", q_en: "For how many years is the Bundestag elected?", options: ["2 Jahre", "4 Jahre", "6 Jahre", "8 Jahre"], correct: 1, a_en: "4 years" },
  { id: 108, q_de: "Bei einer Bundestagswahl in Deutschland darf jeder wählen, der …", q_en: "In a Bundestag election, anyone may vote who …", options: ["in der Bundesrepublik Deutschland wohnt und wählen möchte.", "Bürger / Bürgerin der Bundesrepublik Deutschland ist und mindestens 18 Jahre alt ist.", "seit mindestens 3 Jahren in der Bundesrepublik Deutschland lebt.", "Bürger / Bürgerin der Bundesrepublik Deutschland ist und mindestens 21 Jahre alt ist."], correct: 1, a_en: "is a German citizen and at least 18 years old." },
  { id: 109, q_de: "Wie oft gibt es normalerweise Bundestagswahlen in Deutschland?", q_en: "How often are Bundestag elections normally held?", options: ["alle drei Jahre", "alle vier Jahre", "alle fünf Jahre", "alle sechs Jahre"], correct: 1, a_en: "Every four years" },
  { id: 110, q_de: "Für wie viele Jahre wird der Bundestag in Deutschland gewählt?", q_en: "For how many years is the Bundestag elected?", options: ["2 Jahre", "3 Jahre", "4 Jahre", "5 Jahre"], correct: 2, a_en: "4 years" },
  { id: 111, q_de: "In Deutschland darf man wählen. Was bedeutet das?", q_en: "In Germany you may vote. What does that mean?", options: ["Alle deutschen Staatsangehörigen dürfen wählen, wenn sie das Mindestalter erreicht haben.", "Nur verheiratete Personen dürfen wählen.", "Nur Personen mit einem festen Arbeitsplatz dürfen wählen.", "Alle Einwohner und Einwohnerinnen in Deutschland müssen wählen."], correct: 0, a_en: "All German citizens may vote once they have reached the minimum age." },
  { id: 112, q_de: "Die Wahlen in Deutschland sind …", q_en: "Elections in Germany are …", options: ["speziell.", "geheim.", "berufsbezogen.", "geschlechtsabhängig."], correct: 1, a_en: "secret." },
  { id: 113, q_de: "Wahlen in Deutschland gewinnt die Partei, die …", q_en: "Elections in Germany are won by the party that …", options: ["die meisten Stimmen bekommt.", "die meisten Männer mehrheitlich gewählt haben.", "die meisten Stimmen bei den Arbeitern / Arbeiterinnen bekommen hat.", "die meisten Erststimmen für ihren Kanzlerkandidaten / ihre Kanzlerkandidatin erhalten hat."], correct: 0, a_en: "receives the most votes." },
  { id: 114, q_de: "An demokratischen Wahlen in Deutschland teilzunehmen ist …", q_en: "Taking part in democratic elections in Germany is …", options: ["eine Pflicht.", "ein Recht.", "ein Zwang.", "eine Last."], correct: 1, a_en: "a right." },
  { id: 115, q_de: "Was bedeutet „aktives Wahlrecht“ in Deutschland?", q_en: "What does 'active suffrage' mean in Germany?", options: ["Man kann gewählt werden.", "Man muss wählen gehen.", "Man kann wählen.", "Man muss zur Auszählung der Stimmen gehen."], correct: 2, a_en: "You can vote." },
  { id: 116, q_de: "Wenn Sie bei einer Bundestagswahl in Deutschland wählen dürfen, heißt das …", q_en: "If you may vote in a Bundestag election, this is called …", options: ["aktive Wahlkampagne.", "aktives Wahlverfahren.", "aktiver Wahlkampf.", "aktives Wahlrecht."], correct: 3, a_en: "active suffrage (aktives Wahlrecht)." },
  { id: 117, q_de: "Wie viel Prozent der Zweitstimmen müssen Parteien mindestens bekommen, um in den Deutschen Bundestag gewählt zu werden?", q_en: "What minimum percentage of second votes must parties get to enter the Bundestag?", options: ["3 %", "4 %", "5 %", "6 %"], correct: 2, a_en: "5 %" },
  { id: 118, q_de: "Was regelt das Wahlrecht in Deutschland?", q_en: "What does electoral law regulate in Germany?", options: ["Wer wählen darf, muss wählen.", "Alle die wollen, können wählen.", "Wer nicht wählt, verliert das Recht zu wählen.", "Wer wählen darf, kann wählen."], correct: 3, a_en: "Those entitled to vote may vote (but are not forced to)." },
  { id: 119, q_de: "Wahlen in Deutschland sind frei. Was bedeutet das?", q_en: "Elections in Germany are free. What does that mean?", options: ["Alle verurteilten Straftäter / Straftäterinnen dürfen nicht wählen.", "Wenn ich wählen gehen möchte, muss mein Arbeitgeber / meine Arbeitgeberin mir frei geben.", "Jede Person kann ohne Zwang entscheiden, ob sie wählen möchte und wen sie wählen möchte.", "Ich kann frei entscheiden, wo ich wählen gehen möchte."], correct: 2, a_en: "Everyone can decide without coercion whether and whom to vote for." },
  { id: 120, q_de: "Das Wahlsystem in Deutschland ist ein …", q_en: "The electoral system in Germany is a …", options: ["Zensuswahlrecht.", "Dreiklassenwahlrecht.", "Mehrheits- und Verhältniswahlrecht.", "allgemeines Männerwahlrecht."], correct: 2, a_en: "combination of majority and proportional representation." },
  { id: 121, q_de: "Eine Partei möchte in den Deutschen Bundestag. Sie muss aber einen Mindestanteil an Wählerstimmen haben. Das heißt …", q_en: "A party wants to enter the Bundestag but needs a minimum share of votes. This is called the …", options: ["5 %-Hürde.", "Zulassungsgrenze.", "Basiswert.", "Richtlinie."], correct: 0, a_en: "5 % threshold." },
  { id: 122, q_de: "Welchem Grundsatz unterliegen Wahlen in Deutschland? Wahlen in Deutschland sind …", q_en: "Which principle governs elections in Germany? Elections are …", options: ["frei, gleich, geheim.", "offen, sicher, frei.", "geschlossen, gleich, sicher.", "sicher, offen, freiwillig."], correct: 0, a_en: "free, equal, secret." },
  { id: 123, q_de: "Was ist in Deutschland die „5 %-Hürde“?", q_en: "What is the '5 % threshold' in Germany?", options: ["Abstimmungsregelung im Bundestag für kleine Parteien", "Anwesenheitskontrolle im Bundestag für Abstimmungen", "Mindestanteil an Wählerstimmen, um ins Parlament zu kommen", "Anwesenheitskontrolle im Bundesrat für Abstimmungen"], correct: 2, a_en: "The minimum share of votes needed to enter parliament" },
  { id: 124, q_de: "Die Bundestagswahl in Deutschland ist die Wahl …", q_en: "The Bundestag election in Germany is the election of …", options: ["des Bundeskanzlers / der Bundeskanzlerin.", "der Parlamente der Länder.", "des Parlaments für Deutschland.", "des Bundespräsidenten / der Bundespräsidentin."], correct: 2, a_en: "the parliament for Germany." },
  { id: 125, q_de: "In einer Demokratie ist eine Funktion von regelmäßigen Wahlen, …", q_en: "In a democracy, one function of regular elections is …", options: ["die Bürger und Bürgerinnen zu zwingen, ihre Stimme abzugeben.", "nach dem Willen der Wählermehrheit den Wechsel der Regierung zu ermöglichen.", "im Land bestehende Gesetze beizubehalten.", "den Armen mehr Macht zu geben."], correct: 1, a_en: "to enable a change of government according to the will of the voter majority." },
  { id: 126, q_de: "Was bekommen wahlberechtigte Bürger und Bürgerinnen in Deutschland vor einer Wahl?", q_en: "What do eligible voters receive before an election?", options: ["eine Wahlbenachrichtigung von der Gemeinde", "eine Wahlerlaubnis vom Bundespräsidenten / von der Bundespräsidentin", "eine Benachrichtigung von der Bundesversammlung", "eine Benachrichtigung vom Pfarramt"], correct: 0, a_en: "A polling notification from the municipality" },
  { id: 127, q_de: "Warum gibt es die 5 %-Hürde im Wahlgesetz der Bundesrepublik Deutschland? Es gibt sie, weil …", q_en: "Why does the 5 % threshold exist in German electoral law? Because …", options: ["die Programme von vielen kleinen Parteien viele Gemeinsamkeiten haben.", "die Bürger und Bürgerinnen bei vielen kleinen Parteien die Orientierung verlieren können.", "viele kleine Parteien die Regierungsbildung erschweren.", "die kleinen Parteien nicht so viel Geld haben, um die Politiker und Politikerinnen zu bezahlen."], correct: 2, a_en: "many small parties make forming a government harder." },
  { id: 128, q_de: "Parlamentsmitglieder, die von den Bürgern und Bürgerinnen gewählt werden, nennt man …", q_en: "Members of parliament elected by citizens are called …", options: ["Abgeordnete.", "Kanzler / Kanzlerinnen.", "Botschafter / Botschafterinnen.", "Ministerpräsidenten / Ministerpräsidentinnen."], correct: 0, a_en: "members of parliament (Abgeordnete)." },
  { id: 129, q_de: "Vom Volk gewählt wird in Deutschland …", q_en: "In Germany, directly elected by the people is …", options: ["der Bundeskanzler / die Bundeskanzlerin.", "der Ministerpräsident / die Ministerpräsidentin eines Bundeslandes.", "der Bundestag.", "der Bundespräsident / die Bundespräsidentin."], correct: 2, a_en: "the Bundestag." },
  { id: 130, q_de: "Was enthält ein gültiger Stimmzettel bei einer Bundestagswahl? (Bildfrage, angepasst)", q_en: "What does a valid Bundestag ballot contain? (image question, adapted)", options: ["nur eine Stimme", "eine Erststimme und eine Zweitstimme", "drei Stimmen", "den Namen des Wählers / der Wählerin"], correct: 1, a_en: "A first vote and a second vote" },
  { id: 131, q_de: "In Deutschland ist ein Bürgermeister / eine Bürgermeisterin …", q_en: "In Germany, a mayor is …", options: ["der Leiter / die Leiterin einer Schule.", "der Chef / die Chefin einer Bank.", "das Oberhaupt einer Gemeinde.", "der / die Vorsitzende einer Partei."], correct: 2, a_en: "the head of a municipality." },
  { id: 132, q_de: "Viele Menschen in Deutschland arbeiten in ihrer Freizeit ehrenamtlich. Was bedeutet das?", q_en: "Many people in Germany do volunteer work. What does that mean?", options: ["Sie arbeiten als Soldaten / Soldatinnen.", "Sie arbeiten freiwillig und unbezahlt in Vereinen und Verbänden.", "Sie arbeiten in der Bundesregierung.", "Sie arbeiten in einem Krankenhaus und verdienen dabei Geld."], correct: 1, a_en: "They work voluntarily and unpaid in clubs and associations." },
  { id: 133, q_de: "Was ist bei Bundestags- und Landtagswahlen in Deutschland erlaubt?", q_en: "What is allowed in Bundestag and state elections?", options: ["Der Ehemann wählt für seine Frau mit.", "Man kann durch Briefwahl seine Stimme abgeben.", "Man kann am Wahltag telefonisch seine Stimme abgeben.", "Kinder ab dem Alter von 14 Jahren dürfen wählen."], correct: 1, a_en: "Voting by postal ballot" },
  { id: 134, q_de: "Man will die Buslinie abschaffen, mit der Sie immer zur Arbeit fahren. Was können Sie machen, um die Buslinie zu erhalten?", q_en: "Your bus line to work is to be cancelled. What can you do to keep it?", options: ["Ich beteilige mich an einer Bürgerinitiative für die Erhaltung der Buslinie oder gründe selber eine Initiative.", "Ich werde Mitglied in einem Sportverein und trainiere Rad fahren.", "Ich wende mich an das Finanzamt, weil ich als Steuerzahler / Steuerzahlerin ein Recht auf die Buslinie habe.", "Ich schreibe einen Brief an das Forstamt der Gemeinde."], correct: 0, a_en: "Join or found a citizens' initiative to keep the bus line" },
  { id: 135, q_de: "Wen vertreten die Gewerkschaften in Deutschland?", q_en: "Whom do trade unions represent in Germany?", options: ["große Unternehmen", "kleine Unternehmen", "Selbstständige", "Arbeitnehmer und Arbeitnehmerinnen"], correct: 3, a_en: "Employees" },

  { id: 137, q_de: "Welches Gericht ist in Deutschland bei Konflikten in der Arbeitswelt zuständig?", q_en: "Which court is responsible for workplace conflicts in Germany?", options: ["das Familiengericht", "das Strafgericht", "das Arbeitsgericht", "das Amtsgericht"], correct: 2, a_en: "The labour court (Arbeitsgericht)" },
  { id: 138, q_de: "Was kann ich in Deutschland machen, wenn mir mein Arbeitgeber / meine Arbeitgeberin zu Unrecht gekündigt hat?", q_en: "What can I do if my employer dismissed me unjustly?", options: ["weiter arbeiten und freundlich zum Chef / zur Chefin sein", "ein Mahnverfahren gegen den Arbeitgeber / die Arbeitgeberin führen", "Kündigungsschutzklage erheben", "den Arbeitgeber / die Arbeitgeberin bei der Polizei anzeigen"], correct: 2, a_en: "File an unfair dismissal claim (Kündigungsschutzklage)" },
  { id: 139, q_de: "Wann kommt es in Deutschland zu einem Prozess vor Gericht? Wenn jemand …", q_en: "When does a court trial take place in Germany? When someone …", options: ["zu einer anderen Religion übertritt.", "eine Straftat begangen hat und angeklagt wird.", "eine andere Meinung als die der Regierung vertritt.", "sein Auto falsch geparkt hat und es abgeschleppt wird."], correct: 1, a_en: "has committed a crime and is charged." },
  { id: 140, q_de: "Was macht ein Schöffe / eine Schöffin in Deutschland? Er / Sie …", q_en: "What does a lay judge (Schöffe) do in Germany?", options: ["entscheidet mit Richtern / Richterinnen über Schuld und Strafe.", "gibt Bürgern / Bürgerinnen rechtlichen Rat.", "stellt Urkunden aus.", "verteidigt den Angeklagten / die Angeklagte."], correct: 0, a_en: "Decides on guilt and punishment together with judges" },
  { id: 141, q_de: "Wer berät in Deutschland Personen bei Rechtsfragen und vertritt sie vor Gericht?", q_en: "Who advises people on legal questions and represents them in court?", options: ["ein Rechtsanwalt / eine Rechtsanwältin", "ein Richter / eine Richterin", "ein Schöffe / eine Schöffin", "ein Staatsanwalt / eine Staatsanwältin"], correct: 0, a_en: "A lawyer (Rechtsanwalt/Rechtsanwältin)" },
  { id: 142, q_de: "Was ist die Hauptaufgabe eines Richters / einer Richterin in Deutschland? Ein Richter / eine Richterin …", q_en: "What is the main task of a judge in Germany?", options: ["vertritt Bürger und Bürgerinnen vor einem Gericht.", "arbeitet an einem Gericht und spricht Urteile.", "ändert Gesetze.", "betreut Jugendliche vor Gericht."], correct: 1, a_en: "Works at a court and delivers verdicts" },
  { id: 143, q_de: "Ein Richter / eine Richterin in Deutschland gehört zur …", q_en: "A judge in Germany belongs to the …", options: ["Judikative.", "Exekutive.", "Operative.", "Legislative."], correct: 0, a_en: "judiciary (Judikative)." },
  { id: 144, q_de: "Ein Richter / eine Richterin gehört in Deutschland zur …", q_en: "A judge in Germany belongs to the …", options: ["vollziehenden Gewalt.", "rechtsprechenden Gewalt.", "planenden Gewalt.", "gesetzgebenden Gewalt."], correct: 1, a_en: "judicial power." },
  { id: 145, q_de: "In Deutschland wird die Staatsgewalt geteilt. Für welche Staatsgewalt arbeitet ein Richter / eine Richterin? Für die …", q_en: "State power is divided in Germany. For which branch does a judge work?", options: ["Judikative", "Exekutive", "Presse", "Legislative"], correct: 0, a_en: "The judiciary (Judikative)" },
  { id: 146, q_de: "Wie nennt man in Deutschland ein Verfahren vor einem Gericht?", q_en: "What is a court proceeding called in Germany?", options: ["Programm", "Prozedur", "Protokoll", "Prozess"], correct: 3, a_en: "A trial (Prozess)" },
  { id: 147, q_de: "Was ist die Arbeit eines Richters / einer Richterin in Deutschland?", q_en: "What is the work of a judge in Germany?", options: ["Deutschland regieren", "Recht sprechen", "Pläne erstellen", "Gesetze erlassen"], correct: 1, a_en: "Administering justice" },
  { id: 148, q_de: "Was ist eine Aufgabe der Polizei in Deutschland?", q_en: "What is one task of the police in Germany?", options: ["das Land zu verteidigen", "die Bürgerinnen und Bürger abzuhören", "die Gesetze zu beschließen", "die Einhaltung von Gesetzen zu überwachen"], correct: 3, a_en: "To monitor compliance with the laws" },
  { id: 149, q_de: "Wer kann Gerichtsschöffe / Gerichtsschöffin in Deutschland werden?", q_en: "Who can become a lay judge in Germany?", options: ["alle in Deutschland geborenen Einwohner / Einwohnerinnen über 18 Jahre", "alle deutschen Staatsangehörigen älter als 24 und jünger als 70 Jahre", "alle Personen, die seit mindestens 5 Jahren in Deutschland leben", "nur Personen mit einem abgeschlossenen Jurastudium"], correct: 1, a_en: "German citizens older than 24 and younger than 70" },

  { id: 152, q_de: "Wann waren die Nationalsozialisten mit Adolf Hitler in Deutschland an der Macht?", q_en: "When were the National Socialists under Adolf Hitler in power in Germany?", options: ["1918 bis 1923", "1932 bis 1950", "1933 bis 1945", "1945 bis 1989"], correct: 2, a_en: "1933 to 1945" },

  { id: 155, q_de: "Wann waren die Nationalsozialisten in Deutschland an der Macht?", q_en: "When were the National Socialists in power in Germany?", options: ["1888 bis 1918", "1921 bis 1934", "1933 bis 1945", "1949 bis 1963"], correct: 2, a_en: "1933 to 1945" },

  { id: 159, q_de: "Was gab es in Deutschland nicht während der Zeit des Nationalsozialismus?", q_en: "What did NOT exist in Germany during National Socialism?", options: ["freie Wahlen", "Pressezensur", "willkürliche Verhaftungen", "Verfolgung der Juden"], correct: 0, a_en: "Free elections" },
  { id: 160, q_de: "Welcher Krieg dauerte von 1939 bis 1945?", q_en: "Which war lasted from 1939 to 1945?", options: ["der Erste Weltkrieg", "der Zweite Weltkrieg", "der Vietnamkrieg", "der Golfkrieg"], correct: 1, a_en: "World War II" },
  { id: 161, q_de: "Was kennzeichnete den NS-Staat? Eine Politik …", q_en: "What characterised the Nazi state? A policy of …", options: ["des staatlichen Rassismus", "der Meinungsfreiheit", "der allgemeinen Religionsfreiheit", "der Entwicklung der Demokratie"], correct: 0, a_en: "state racism" },
  { id: 162, q_de: "Claus Schenk Graf von Stauffenberg wurde bekannt durch …", q_en: "Claus Schenk Graf von Stauffenberg became known for …", options: ["eine Goldmedaille bei den Olympischen Spielen 1936.", "den Bau des Reichstagsgebäudes.", "den Aufbau der Wehrmacht.", "das Attentat auf Hitler am 20. Juli 1944."], correct: 3, a_en: "the assassination attempt on Hitler on 20 July 1944." },
  { id: 163, q_de: "In welchem Jahr zerstörten die Nationalsozialisten Synagogen und jüdische Geschäfte in Deutschland?", q_en: "In which year did the Nazis destroy synagogues and Jewish shops in Germany?", options: ["1925", "1930", "1938", "1945"], correct: 2, a_en: "1938" },
  { id: 164, q_de: "Was passierte am 9. November 1938 in Deutschland?", q_en: "What happened in Germany on 9 November 1938?", options: ["Mit dem Angriff auf Polen beginnt der Zweite Weltkrieg.", "Die Nationalsozialisten verlieren eine Wahl und lösen den Reichstag auf.", "Jüdische Geschäfte und Synagogen werden durch Nationalsozialisten und ihre Anhänger zerstört.", "Hitler wird Reichspräsident und lässt alle Parteien verbieten."], correct: 2, a_en: "Jewish shops and synagogues were destroyed by Nazis and their supporters." },
  { id: 165, q_de: "Wie hieß der erste Bundeskanzler der Bundesrepublik Deutschland?", q_en: "Who was the first Federal Chancellor of Germany?", options: ["Konrad Adenauer", "Kurt Georg Kiesinger", "Helmut Schmidt", "Willy Brandt"], correct: 0, a_en: "Konrad Adenauer" },
  { id: 166, q_de: "Wie hieß bis zum Jahre 2002 die Währung in der Bundesrepublik Deutschland?", q_en: "What was Germany's currency called until 2002?", options: ["Deutsche Mark", "Reichsmark", "Deutsches Geld", "Reichsgeld"], correct: 0, a_en: "The Deutsche Mark" },
  { id: 167, q_de: "Welche Länder wurden nach dem Zweiten Weltkrieg in Deutschland als „Alliierte Besatzungsmächte“ bezeichnet?", q_en: "Which countries were the 'Allied occupying powers' in Germany after WWII?", options: ["Sowjetunion, Großbritannien, Polen, Schweden", "Frankreich, Sowjetunion, Italien, Japan", "USA, Sowjetunion, Spanien, Portugal", "USA, Sowjetunion, Großbritannien, Frankreich"], correct: 3, a_en: "USA, Soviet Union, Great Britain, France" },

  { id: 169, q_de: "Wann wurde die Bundesrepublik Deutschland gegründet?", q_en: "When was the Federal Republic of Germany founded?", options: ["1939", "1945", "1949", "1951"], correct: 2, a_en: "1949" },
  { id: 170, q_de: "Seit wann gibt es das Grundgesetz der Bundesrepublik Deutschland? Seit …", q_en: "Since when has the Basic Law existed?", options: ["1919", "1933", "1949", "1989"], correct: 2, a_en: "1949" },
  { id: 171, q_de: "Soziale Marktwirtschaft bedeutet, die Wirtschaft …", q_en: "Social market economy means that the economy …", options: ["steuert sich allein nach Angebot und Nachfrage.", "wird vom Staat geplant und gesteuert, Angebot und Nachfrage werden nicht berücksichtigt.", "richtet sich nach der Nachfrage im Ausland.", "richtet sich nach Angebot und Nachfrage, aber der Staat sorgt für einen sozialen Ausgleich."], correct: 3, a_en: "follows supply and demand, but the state provides social balance." },
  { id: 172, q_de: "In welcher Besatzungszone wurde die DDR gegründet? In der …", q_en: "In which occupation zone was the GDR founded?", options: ["amerikanischen Besatzungszone", "französischen Besatzungszone", "britischen Besatzungszone", "sowjetischen Besatzungszone"], correct: 3, a_en: "The Soviet occupation zone" },
  { id: 173, q_de: "Die Bundesrepublik Deutschland ist ein Gründungsmitglied …", q_en: "The Federal Republic of Germany is a founding member of …", options: ["des Nordatlantikpakts (NATO).", "der Vereinten Nationen (VN).", "der Europäischen Union (EU).", "des Warschauer Pakts."], correct: 2, a_en: "the European Union (EU)." },

  { id: 176, q_de: "Welche Besatzungsmacht kontrollierte nach 1945 den Osten Deutschlands? (Bildfrage, angepasst)", q_en: "Which occupying power controlled eastern Germany after 1945? (image question, adapted)", options: ["die USA", "Großbritannien", "Frankreich", "die Sowjetunion"], correct: 3, a_en: "The Soviet Union" },

  { id: 178, q_de: "Vom Juni 1948 bis zum Mai 1949 wurden die Bürger und Bürgerinnen von West-Berlin durch eine Luftbrücke versorgt. Welcher Umstand war dafür verantwortlich?", q_en: "From June 1948 to May 1949, West Berlin was supplied by airlift. What caused this?", options: ["Für Frankreich war eine Versorgung der West-Berliner Bevölkerung mit dem Flugzeug kostengünstiger.", "Die amerikanischen Soldaten / Soldatinnen hatten beim Landtransport Angst vor Überfällen.", "Für Großbritannien war die Versorgung über die Luftbrücke schneller.", "Die Sowjetunion unterbrach den gesamten Verkehr auf dem Landwege."], correct: 3, a_en: "The Soviet Union blocked all land routes." },
  { id: 179, q_de: "Wie endete der Zweite Weltkrieg in Europa offiziell?", q_en: "How did WWII officially end in Europe?", options: ["mit dem Tod Adolf Hitlers", "durch die bedingungslose Kapitulation Deutschlands", "mit dem Rückzug der Deutschen aus den besetzten Gebieten", "durch eine Revolution in Deutschland"], correct: 1, a_en: "Through Germany's unconditional surrender" },

  { id: 181, q_de: "Was wollte Willy Brandt mit seinem Kniefall 1970 im ehemaligen jüdischen Ghetto in Warschau ausdrücken?", q_en: "What did Willy Brandt express by kneeling in the former Warsaw ghetto in 1970?", options: ["Er hat sich den ehemaligen Alliierten unterworfen.", "Er bat Polen und die polnischen Juden um Vergebung.", "Er zeigte seine Demut vor dem Warschauer Pakt.", "Er sprach ein Gebet am Grab des Unbekannten Soldaten."], correct: 1, a_en: "He asked Poland and Polish Jews for forgiveness." },
  { id: 182, q_de: "Welche Parteien wurden 1946 zwangsweise zur SED vereint, der Einheitspartei der späteren DDR?", q_en: "Which parties were forcibly merged into the SED in 1946?", options: ["KPD und SPD", "SPD und CDU", "CDU und FDP", "KPD und CSU"], correct: 0, a_en: "KPD and SPD" },

  { id: 184, q_de: "Was nannten die Menschen in Deutschland sehr lange „Die Stunde Null“?", q_en: "What did people in Germany long call 'zero hour'?", options: ["Damit wird die Zeit nach der Wende im Jahr 1989 bezeichnet.", "Damit wurde der Beginn des Zweiten Weltkrieges bezeichnet.", "Darunter verstand man das Ende des Zweiten Weltkrieges und den Beginn des Wiederaufbaus.", "Damit ist die Stunde gemeint, in der die Uhr von der Sommerzeit auf die Winterzeit umgestellt wird."], correct: 2, a_en: "The end of WWII and the start of reconstruction" },
  { id: 185, q_de: "Wofür stand der Ausdruck „Eiserner Vorhang“? Für die Abschottung …", q_en: "What did the term 'Iron Curtain' stand for? The sealing-off of …", options: ["des Warschauer Pakts gegen den Westen", "Norddeutschlands gegen Süddeutschland", "Nazi-Deutschlands gegen die Alliierten", "Europas gegen die USA"], correct: 0, a_en: "the Warsaw Pact against the West" },
  { id: 186, q_de: "Im Jahr 1953 gab es in der DDR einen Aufstand, an den lange Zeit in der Bundesrepublik Deutschland ein Feiertag erinnerte. Wann war das?", q_en: "In 1953 there was an uprising in the GDR, long commemorated by a holiday in West Germany. When was it?", options: ["1. Mai", "17. Juni", "20. Juli", "9. November"], correct: 1, a_en: "17 June" },
  { id: 187, q_de: "Wie hieß die letzte deutsche Währung vor der Einführung des Euro?", q_en: "What was the last German currency before the euro?", options: ["Reichsmark", "Rentenmark", "Deutsche Mark", "Deutsches Pfund"], correct: 2, a_en: "The Deutsche Mark" },
  { id: 188, q_de: "In welchem Jahr wurde die Mauer in Berlin gebaut?", q_en: "In which year was the Berlin Wall built?", options: ["1953", "1956", "1959", "1961"], correct: 3, a_en: "1961" },

  { id: 191, q_de: "Wann wurde die Mauer in Berlin für alle geöffnet?", q_en: "When was the Berlin Wall opened for everyone?", options: ["1987", "1989", "1992", "1995"], correct: 1, a_en: "1989" },
  { id: 192, q_de: "Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?", q_en: "Which of today's federal states used to belong to the GDR?", options: ["Brandenburg", "Bayern", "Saarland", "Hessen"], correct: 0, a_en: "Brandenburg" },

  { id: 237, q_de: "2007 wurde das 50-jährige Jubiläum der „Römischen Verträge“ gefeiert. Was war der Inhalt der Verträge?", q_en: "In 2007 the 50th anniversary of the Treaties of Rome was celebrated. What was their content?", options: ["Beitritt Deutschlands zur NATO", "Gründung der Europäischen Wirtschaftsgemeinschaft (EWG)", "Verpflichtung Deutschlands zu Reparationsleistungen", "Festlegung der Oder-Neiße-Linie als Ostgrenze"], correct: 1, a_en: "Founding of the European Economic Community (EEC)" },

  { id: 250, q_de: "Was gehört zum „Elternrecht“ in Deutschland?", q_en: "What is part of 'parental rights' in Germany?", options: ["Eltern verheiraten ihre Kinder.", "Eltern erziehen ihre Kinder bis zum 18. Lebensjahr.", "Eltern bestimmen den Beruf ihrer Kinder.", "Eltern haben mehr Rechte als andere Bürger / Bürgerinnen."], correct: 1, a_en: "Parents raise their children until age 18." },
  { id: 251, q_de: "Wenn man in Deutschland ein Kind schlägt, …", q_en: "If you hit a child in Germany, …", options: ["geht das niemanden etwas an.", "geht das nur die Familie etwas an.", "kann man dafür nicht bestraft werden.", "kann man dafür bestraft werden."], correct: 3, a_en: "you can be punished for it." },
  { id: 252, q_de: "In Deutschland …", q_en: "In Germany …", options: ["darf man zur gleichen Zeit nur mit einem Partner / einer Partnerin verheiratet sein.", "kann man mehrere Ehepartner / Ehepartnerinnen gleichzeitig haben.", "darf man nicht wieder heiraten, wenn man einmal verheiratet war.", "darf eine Frau nicht wieder heiraten, wenn ihr Mann gestorben ist."], correct: 0, a_en: "you may only be married to one partner at a time." },

  { id: 254, q_de: "In Deutschland dürfen Ehepaare sich scheiden lassen. Meistens müssen sie dazu das „Trennungsjahr“ einhalten. Was bedeutet das?", q_en: "Married couples in Germany may divorce, usually after the 'year of separation'. What does that mean?", options: ["Der Scheidungsprozess dauert ein Jahr.", "Mann und Frau sind ein Jahr verheiratet, dann ist die Scheidung möglich.", "Das Besuchsrecht für die Kinder gilt ein Jahr.", "Mann und Frau führen mindestens ein Jahr getrennt ihr eigenes Leben. Danach ist die Scheidung möglich."], correct: 3, a_en: "The spouses live separate lives for at least a year; then divorce is possible." },
  { id: 255, q_de: "Bei Erziehungsproblemen können Eltern in Deutschland Hilfe erhalten vom …", q_en: "For parenting problems, parents can get help from the …", options: ["Ordnungsamt.", "Schulamt.", "Jugendamt.", "Gesundheitsamt."], correct: 2, a_en: "youth welfare office (Jugendamt)." },
  { id: 256, q_de: "Ein Ehepaar möchte in Deutschland ein Restaurant eröffnen. Was braucht es dazu unbedingt?", q_en: "A couple wants to open a restaurant in Germany. What do they definitely need?", options: ["eine Erlaubnis der Polizei", "eine Genehmigung einer Partei", "eine Genehmigung des Einwohnermeldeamts", "eine Gaststättenerlaubnis von der zuständigen Behörde"], correct: 3, a_en: "A restaurant licence from the responsible authority" },
  { id: 257, q_de: "Eine erwachsene Frau möchte in Deutschland das Abitur nachholen. Das kann sie an …", q_en: "An adult woman wants to catch up on her Abitur. She can do so at …", options: ["einer Hochschule.", "einem Abendgymnasium.", "einer Hauptschule.", "einer Privatuniversität."], correct: 1, a_en: "an evening grammar school (Abendgymnasium)." },

  { id: 259, q_de: "Das Berufsinformationszentrum BIZ bei der Bundesagentur für Arbeit in Deutschland hilft bei der …", q_en: "The BIZ careers information centre at the Federal Employment Agency helps with …", options: ["Rentenberechnung.", "Lehrstellensuche.", "Steuererklärung.", "Krankenversicherung."], correct: 1, a_en: "finding an apprenticeship." },

  { id: 261, q_de: "Ein Mann möchte mit 30 Jahren in Deutschland sein Abitur nachholen. Wo kann er das tun? An …", q_en: "A 30-year-old man wants to catch up on his Abitur. Where can he do so?", options: ["einer Hochschule", "einem Abendgymnasium", "einer Hauptschule", "einer Privatuniversität"], correct: 1, a_en: "At an evening grammar school (Abendgymnasium)" },
  { id: 262, q_de: "Was bedeutet in Deutschland der Grundsatz der Gleichbehandlung?", q_en: "What does the principle of equal treatment mean in Germany?", options: ["Niemand darf z. B. wegen einer Behinderung benachteiligt werden.", "Man darf andere Personen benachteiligen, wenn ausreichende persönliche Gründe hierfür vorliegen.", "Niemand darf gegen Personen klagen, wenn sie benachteiligt wurden.", "Es ist für alle Gesetz, benachteiligten Gruppen jährlich Geld zu spenden."], correct: 0, a_en: "No one may be disadvantaged, e.g. because of a disability." },

  { id: 267, q_de: "Eine junge Frau in Deutschland, 22 Jahre alt, lebt mit ihrem Freund zusammen. Die Eltern der Frau finden das nicht gut, weil ihnen der Freund nicht gefällt. Was können die Eltern tun?", q_en: "A 22-year-old woman lives with her boyfriend. Her parents disapprove. What can the parents do?", options: ["Sie müssen die Entscheidung der volljährigen Tochter respektieren.", "Sie haben das Recht, die Tochter in die elterliche Wohnung zurückzuholen.", "Sie können zur Polizei gehen und die Tochter anzeigen.", "Sie suchen einen anderen Mann für die Tochter."], correct: 0, a_en: "They must respect their adult daughter's decision." },

const KEY = "lid-state-v2";
const DEF = { goal:null, learnedIds:[], sessions:[], tests:[] };
let S = load();
let saveErr = false;
let view = S.goal ? "home" : "setup";
let batch=[], ci=0, flipped=false;
let tq=[], ti=0, score=0, picked=-1, testKind="t", showBackup=false, backupMsg="", confirmReset=false;

function load(){ try{ const r=localStorage.getItem(KEY); return r?Object.assign({},DEF,JSON.parse(r)):Object.assign({},DEF);}catch(e){ return Object.assign({},DEF);} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); saveErr=false; }catch(e){ saveErr=true; } }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const learned = () => new Set(S.learnedIds);
const doneToday = () => S.sessions.some(s=>s.date===today());

function setGoal(g){ S.goal=g; save(); view="home"; render(); }
function startLearn(){
  const l=learned();
  batch = QUESTIONS.filter(q=>!l.has(q.id)).slice(0, S.goal);
  if(!batch.length) return;
  ci=0; flipped=false; view="learn"; render();
}
function flip(){ flipped=!flipped; render(); }
function prevCard(){ if(ci>0){ ci--; flipped=false; render(); } }
function nextCard(){
  if(ci < batch.length-1){ ci++; flipped=false; render(); }
  else {
    const ids=batch.map(q=>q.id);
    S.learnedIds=[...new Set([...S.learnedIds,...ids])];
    S.sessions.push({date:today(), learnedIds:ids});
    save(); view="home"; render();
  }
}
function startTest(kind){
  const l=learned();
  let pool;
  if(kind==="t"){
    const ids=new Set(S.sessions.filter(s=>s.date===today()).flatMap(s=>s.learnedIds));
    pool=QUESTIONS.filter(q=>ids.has(q.id));
  } else {
    pool=shuffle(QUESTIONS.filter(q=>l.has(q.id))).slice(0,30);
  }
  tq = shuffle(pool).map(q=>{
    const order=shuffle([0,1,2,3]);
    return { q, opts:order.map(i=>q.options[i]), correct:order.indexOf(q.correct) };
  });
  if(!tq.length) return;
  testKind=kind; ti=0; score=0; picked=-1; view="test"; render();
}
function pick(i){
  if(picked>=0) return;
  picked=i; if(i===tq[ti].correct) score++;
  render();
}
function nextQ(){
  if(ti < tq.length-1){ ti++; picked=-1; render(); }
  else { S.tests.push({date:today(), score:score, total:tq.length, kind:testKind}); save(); view="result"; render(); }
}
function goHome(){ view="home"; render(); }
function goSetup(){ view="setup"; render(); }
function toggleBackup(){ showBackup=!showBackup; backupMsg=""; confirmReset=false; render(); }
function copyCode(){
  const code=btoa(JSON.stringify(S));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{ backupMsg="Kopiert \u2713 / Copied \u2713"; render(); },()=>{ backupMsg="Bitte manuell kopieren. / Please copy manually."; render(); });
  } else { backupMsg="Bitte manuell kopieren. / Please copy manually."; render(); }
}
function restore(){
  try{
    const v=document.getElementById("restoreIn").value.trim();
    const p=JSON.parse(atob(v));
    if(!p || !Array.isArray(p.learnedIds)) throw 0;
    S=Object.assign({},DEF,p); save(); backupMsg="Wiederhergestellt \u2713 / Restored \u2713"; render();
  }catch(e){ backupMsg="Ung\u00fcltiger Code. / Invalid code."; render(); }
}

function resetAll(){
  if(!confirmReset){ confirmReset=true; render(); return; }
  S=Object.assign({},DEF); save(); confirmReset=false; showBackup=false; view="setup"; render();
}
function render(){
  const app=document.getElementById("app");
  if(view==="setup"){
    app.innerHTML = `
      <h1>Leben in Deutschland</h1>
      <p class="sub">Fragenkatalog lernen &middot; Learn the question catalogue</p>
      <p style="font-size:16px;margin-top:8px;">Wie viele neue Fragen pro Tag? / How many new questions per day?</p>
      <div class="goalbtns">
        ${[5,10,15,20,50].map(g=>`<button class="btn"${g===50?' style="grid-column:1/-1"':''} onclick="setGoal(${g})">${g} Fragen</button>`).join("")}
      </div>`;
    return;
  }
  if(view==="home"){
    const total=QUESTIONS.length, l=S.learnedIds.length;
    const berlin=S.learnedIds.filter(id=>id>=900).length;
    const last=S.tests.slice(-3).reverse();
    app.innerHTML = `
      <h1>Leben in Deutschland</h1>
      <p class="sub">Fragenkatalog lernen &middot; Learn the question catalogue</p>
      <div class="row"><span>Gelernt / Learned</span><b>${l} / ${total}</b></div>

      <div class="row"><span>Berlin-Fragen / Berlin questions</span><b>${berlin} / 10</b></div>
      ${last.map(t=>`<div class="row"><span>${t.kind==="r"?"Zufallstest":"Tagestest"} ${t.date}</span><b>${t.score} / ${t.total}</b></div>`).join("")}
      <div class="spacer"></div>
      <button class="btn" onclick="startLearn()" ${doneToday()||l>=total?"disabled":""}>
        ${doneToday() ? "Heute schon gelernt \u2713 / Done for today" : (l>=total ? "Alles gelernt \u2713 / All done" : `Heute lernen: ${Math.min(S.goal,total-l)} Fragen / Learn today's cards`)}
      </button>
      <button class="btn2" onclick="startTest('t')" ${S.sessions.some(s=>s.date===today())?"":"disabled"}>Tagestest: heutige Fragen / Today's test</button>
      <button class="btn2" onclick="startTest('r')" ${l===0?"disabled":""}>Zufallstest: ${Math.min(30,l)} aus allen Gelernten / Random review</button>
      <button class="link" onclick="goSetup()">Tagesziel \u00e4ndern / Change daily goal</button><br>
      <button class="link" onclick="toggleBackup()">Fortschritt sichern &amp; wiederherstellen / Backup &amp; restore</button>
      ${saveErr ? `<p class="warn">Fortschritt konnte nicht gespeichert werden. / Progress could not be saved.</p>` : ""}
      ${showBackup ? `
        <div class="backup">
          <p class="sub" style="margin-bottom:2px;">Dein Fortschrittscode / Your progress code:</p>
          <textarea readonly onfocus="this.select()">${btoa(JSON.stringify(S))}</textarea>
          <button class="btn2" onclick="copyCode()">Code kopieren / Copy code</button>
          <p class="sub" style="margin:12px 0 2px;">Code einf\u00fcgen zum Wiederherstellen / Paste code to restore:</p>
          <textarea id="restoreIn"></textarea>
          <button class="btn2" onclick="restore()">Wiederherstellen / Restore</button>
          ${backupMsg?`<p class="sub" style="margin-top:8px;">${backupMsg}</p>`:""}
          <button class="btn2" style="margin-top:16px;border-color:#c00;color:#c00;" onclick="resetAll()">${confirmReset?"Wirklich alles zur\u00fccksetzen? / Really reset everything?":"Fortschritt zur\u00fccksetzen / Reset progress"}</button>
        </div>`:""}
    `;
    return;
  }
  if(view==="learn"){
    const q=batch[ci];
    app.innerHTML = `
      <p class="progress">Karte ${ci+1} / ${batch.length}</p>
      ${q.land?`<span class="badge">${esc(q.land)}</span>`:""}
      <div class="card ${flipped?"flipped":""}" onclick="flip()">
        <div class="card-inner">
          <div class="face front">
            <p class="q-de">${esc(q.q_de)}</p>
            <p class="q-en">${esc(q.q_en)}</p>
          </div>
          <div class="face back">
            <p class="a-de">${esc(q.options[q.correct])}</p>
            <p class="q-en">${esc(q.a_en)}</p>
          </div>
        </div>
      </div>
      <p class="hint">Tippen zum Umdrehen / Tap to flip</p>
      <div style="display:flex;gap:10px;">
        <button class="btn2" style="flex:1;margin-top:14px;" onclick="prevCard()" ${ci===0?"disabled":""}>&#8592; Zur\u00fcck / Back</button>
        <button class="btn" style="flex:2;" onclick="nextCard()" ${flipped?"":"disabled"}>${ci===batch.length-1?"Fertig \u2713 / Finish":"Weiter / Next"}</button>
      </div>
      <button class="link" onclick="goHome()">Abbrechen / Cancel</button>
    `;
    return;
  }
  if(view==="test"){
    const t=tq[ti];
    app.innerHTML = `
      <p class="progress">${testKind==="r"?"Zufallstest":"Tagestest"} &nbsp;&middot;&nbsp; Frage ${ti+1} / ${tq.length} &nbsp;&middot;&nbsp; Richtig: ${score}</p>
      ${t.q.land?`<span class="badge">${esc(t.q.land)}</span>`:""}
      <p class="q-de" style="margin-bottom:16px;">${esc(t.q.q_de)}</p>
      ${t.opts.map((o,i)=>{
        let cls="opt";
        if(picked>=0){ if(i===t.correct) cls+=" correct"; else if(i===picked) cls+=" wrong"; }
        return `<button class="${cls}" onclick="pick(${i})" ${picked>=0?"disabled":""}>${esc(o)}</button>`;
      }).join("")}
      <div class="spacer"></div>
      ${picked>=0?`<button class="btn" onclick="nextQ()">${ti===tq.length-1?"Ergebnis / Result":"Weiter / Next"}</button>`:""}
      <button class="link" onclick="goHome()">Abbrechen / Cancel</button>
    `;
    return;
  }
  if(view==="result"){
    const pct=Math.round(100*score/tq.length);
    app.innerHTML = `
      <h1>Testergebnis / Result</h1>
      <p class="score">${score} / ${tq.length}</p>
      <p class="sub">${pct}% richtig / correct</p>
      <p style="font-size:15px;line-height:1.5;">Im echten Test brauchst du 17 von 33 Punkten. ${pct>=52?"Das h\u00e4ttest du geschafft! \u{1F389}":"Weiter \u00fcben \u2013 das wird!"} / The real test requires 17 of 33. ${pct>=52?"You would have passed!":"Keep practising \u2013 you'll get there!"}</p>
      <div class="spacer"></div>
      <button class="btn" onclick="goHome()">Zur\u00fcck / Home</button>
    `;
    return;
  }
}
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
